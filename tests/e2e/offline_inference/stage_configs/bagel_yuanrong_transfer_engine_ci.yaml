# stage config for running BAGEL with Yuanrong transfer_engine connector.
# This config targets the Bagel thinker -> dit split and mirrors the existing
# mooncake/shared-memory CI configs, but uses YuanrongTransferEngineConnector
# for both stage payload transfer and Bagel KV-cache transfer.
#
# Notes:
# - `sender_host` / `sender_zmq_port` are required because Bagel KV receive
#   polls the connector with `metadata=None`, so the receiver must know how to
#   query the sender's metadata/control plane.
# - `host: "auto"` is kept role-local so sender/receiver can each auto-detect
#   their own bind address.
# - If `yr.datasystem` is not already installed in the environment, replace
#   `${YUANRONG_TRANSFER_ENGINE_PYTHON_PATH}` before use, for example with
#   `C:/Code/yuanrong-datasystem/transfer_engine`.

stage_args:
  - stage_id: 0
    stage_type: llm
    prompt_expand_func: vllm_omni.model_executor.stage_input_processors.bagel.expand_cfg_prompts
    runtime:
      devices: "0"
    engine_args:
      model_stage: thinker
      max_num_seqs: 1
      model_arch: BagelForConditionalGeneration
      worker_type: ar
      scheduler_cls: vllm_omni.core.sched.omni_ar_scheduler.OmniARScheduler
      gpu_memory_utilization: 0.45
      enforce_eager: true
      trust_remote_code: true
      engine_output_type: text
      distributed_executor_backend: mp
      enable_prefix_caching: false
      max_num_batched_tokens: 32768
      tensor_parallel_size: 1
      load_format: dummy
      omni_kv_config:
        need_send_cache: true
        kv_transfer_criteria:
          type: prefill_finished
    final_output: true
    final_output_type: text
    is_comprehension: true
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      top_k: 1
      max_tokens: 2048
      seed: 52
      detokenize: true
      repetition_penalty: 1.05
    output_connectors:
      to_stage_1: yuanrong_transfer_engine_connector

  - stage_id: 1
    stage_type: diffusion
    cfg_kv_collect_func: vllm_omni.model_executor.stage_input_processors.bagel.collect_cfg_kv_caches
    runtime:
      devices: "0"
    engine_args:
      model_stage: dit
      max_num_seqs: 1
      gpu_memory_utilization: 0.45
      enforce_eager: true
      trust_remote_code: true
      engine_output_type: image
      distributed_executor_backend: mp
      enable_prefix_caching: false
      max_num_batched_tokens: 32768
      tensor_parallel_size: 1
      load_format: dummy
      omni_kv_config:
        need_recv_cache: true
    engine_input_source: [0]
    final_output: true
    final_output_type: image
    is_comprehension: false
    default_sampling_params:
      seed: 52
    input_connectors:
      from_stage_0: yuanrong_transfer_engine_connector

runtime:
  enabled: true
  defaults:
    window_size: -1
    max_inflight: 1
  connectors:
    yuanrong_transfer_engine_connector:
      name: YuanrongTransferEngineConnector
      extra:
        host: "auto"
        sender_host: "${YUANRONG_TRANSFER_ENGINE_SENDER_HOST}"
        zmq_port: "${YUANRONG_TRANSFER_ENGINE_ZMQ_PORT}"
        sender_zmq_port: "${YUANRONG_TRANSFER_ENGINE_ZMQ_PORT}"
        rpc_port: "auto"
        protocol: "ascend"
        device_name: "${YUANRONG_TRANSFER_ENGINE_DEVICE_NAME}"
        memory_pool_size: 2147483648
        memory_pool_device: "cpu"
        transfer_engine_python_path: "${YUANRONG_TRANSFER_ENGINE_PYTHON_PATH}"
  edges:
    - from: 0
      to: 1
      window_size: -1
